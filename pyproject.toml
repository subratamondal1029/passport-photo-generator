[project]
name = "passport-photo-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Subrata Mondal", email = "subratamondal@tutanota.com" }
]
requires-python = ">=3.10, <3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=2.0.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "rembg[cpu]>=2.0.60",
]

[project.scripts]
passport-photo-generator = "passport_photo_generator:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
