[project]
name = "passport-photo-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Subrata Mondal", email = "subratamondal@tutanota.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mediapipe>=1.1.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "rembg[cpu]>=2.0.85",
]

[project.scripts]
passport-photo-generator = "passport_photo_generator:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
